<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Font pairings (temporary)</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
        body { margin: 0; background: #1a1626; color: #f1efe8; font: 16px/1.5 system-ui, sans-serif; }
        .fx-head, .fx-pair { max-width: 1400px; margin: 0 auto; padding: 24px 24px 8px; }
        h1 { margin: 0 0 6px; font-size: 26px; } h2 { margin: 0 0 4px; font-size: 22px; color: #f6c94a; }
        .fx-pair p, .fx-head p { margin: 0 0 14px; color: #c9c4d6; }
        code { color: #f6c94a; }
        .fx-frames { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px; }
        figure { margin: 0; } figcaption { font-size: 13px; color: #aab8d4; margin-bottom: 6px; }
        iframe { width: 100%; height: 860px; border: 2px solid #4a3f58; background: #fff; display: block; }
        @media (max-width: 900px) { .fx-frames { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<!--fonts-content-->
</body>
</html>
